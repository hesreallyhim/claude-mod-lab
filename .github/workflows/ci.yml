name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      HUSKY: "0"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check web formatting, lint, types, and test coverage
        run: npm run check:web

      - name: Test the CLI
        run: npm run test:bin

      - name: Test release and distribution scripts
        run: npm run test:scripts

      # The workspace integration suite needs Claude; these lesson suites do not.
      - name: Test lesson parsing and workspace creation
        run: node --test learn/test/lessons.test.mjs learn/test/start.test.mjs

      - name: Check file lengths
        run: npm run lines
